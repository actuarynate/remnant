<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMNI: Life 3.0 Survival</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- NEW: The Skills Dashboard -->
<div id="dashboard">
    <h3>OMNI NEURAL LINK: <span class="gold-text">ACTIVE</span></h3>
    <div id="skills-grid">
        <!-- JavaScript will inject the 12 skill slots here -->
    </div>
</div>

<div id="game-container">
    <h1 class="glitch">OMNI TERMINAL</h1>
    <p id="story-text">INITIALIZING CONSCIOUSNESS...</p>
    <div id="choices"></div>
    
    <div id="reward-section">
        <h2>>> SKILL UNLOCKED: <span id="skill-name" style="color: #ffd700;"></span></h2>
        <p>Your defiance grants you a reward in the physical realm.</p>
        <p>Use code <span id="merch-code-display" class="merch-code"></span> at checkout.</p>
        
        <a id="share-link" href="#" target="_blank">
            <button class="social-btn">LEAK DOSSIER ON X (TWITTER)</button>
        </a>
    </div>
</div>

<script src="script.js"></script>

</body>
</html>
